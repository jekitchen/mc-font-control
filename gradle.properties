org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Toolchain (PRD D7). Versions from https://fabricmc.net/develop and
# https://maven.fabricmc.net, checked 2026-11-11. Never guess these.
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.4
fabric_api_version=0.166.0+26.3
modmenu_version=21.0.0

# Compatibility testing only (-PwithSodiumIris); never bundled
sodium_version=mc26.3-0.9.2-fabric
iris_version=1.11.7+26.3-fabric
# NeoForge smoke test with Sodium and Iris (PRD D57), from https://modrinth.com/mod/sodium and
# /mod/iris and https://maven.neoforged.net, checked 2026-11-13.
# -PwithSodium: Sodium alone, on Fontsys's NeoForge (neoforge_version below). The 0.9.3 betas are
# the only Sodium builds that start on NeoForge 26.3.0.65-beta or later: Sodium 0.9.2 hooks a
# NeoForge method that NeoForge #3619 removed in 26.3.0.65-beta.
sodium_neoforge_version=mc26.3-0.9.3-beta.5-neoforge
# -PwithSodiumIris: the release pair, Sodium 0.9.2 and Iris 1.11.7 (Iris declares this Sodium; the
# Fabric suite uses the same pair). The 0.9.3 betas refuse Iris below 1.12.1, which isn't out, so
# until it is this is the only pair that loads, and only on NeoForge up to 26.3.0.64-beta. That
# run builds against this NeoForge instead; the jar players get still requires 26.3.0.103.
sodium_iris_neoforge_version=mc26.3-0.9.2-neoforge
iris_neoforge_version=1.11.7+26.3-neoforge
neoforge_iris_version=26.3.0.64-beta

# Quilt compatibility check only (./gradlew runQuiltClientGameTest, PRD D57); never a dependency.
# The latest Quilt Loader and the libraries its 26.3 launcher profile lists, from
# https://meta.quiltmc.org/v3/versions/loader/26.3/0.31.0-beta.6/profile/json, checked 2026-11-13.
quilt_loader_version=0.31.0-beta.6
quilt_json5_version=1.0.4+final
quilt_config_version=1.3.3
quilt_mixin_version=0.17.4+mixin.0.8.7

# NeoForge build (PRD D51). Versions from https://maven.neoforged.net and the official
# NeoForge 26.3 MDK (NeoForgeMDKs/MDK-26.3-ModDevGradle), checked 2026-11-13.
neoforge_version=26.3.0.103
moddev_version=2.0.148

# Unit tests (PRD D17)
junit_version=5.13.4

# Mod properties (PRD D15, D18): semver with the Minecraft version as build metadata
mod_version=1.2.0
maven_group=io.github.jekitchen.fontsys
archives_base_name=fontsys

# Release (PRD D31, D32): Minecraft versions the jar is listed for on Modrinth and CurseForge, comma-separated
publish_game_versions=26.3
