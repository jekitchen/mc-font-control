# Build and test every pull request and every push to main (PRD D17).
name: build
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: fontsys-jar
          path: build/libs/
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/
            build/test-results/

  # Boots the real client under Xvfb and runs src/gametest (PRD D17, open question 4).
  client-game-test:
    runs-on: ubuntu-24.04
    # A client that can't open its window waits forever; fail fast instead of after 6 hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mods: [vanilla, sodium-iris]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      # Software OpenGL (llvmpipe) and, as in Fabric API's CI, software Vulkan.
      - name: Install Xvfb and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers
      - name: Run client game tests
        env:
          # 26.3 asks SDL for an sRGB-capable OpenGL framebuffer. Xvfb's GLX offers no sRGB visuals,
          # so OpenGL fails there; EGL handles sRGB per surface instead. Sodium and Iris need OpenGL.
          SDL_VIDEO_FORCE_EGL: '1'
        run: |
          chmod +x ./gradlew
          # Virtual display for the client window.
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest ${{ matrix.mods == 'sodium-iris' && '-PwithSodiumIris' || '' }}
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-game-test-${{ matrix.mods }}
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
            build/run/clientGameTest/crash-reports/
            build/run/clientGameTest/config/fontsys/
          if-no-files-found: ignore
