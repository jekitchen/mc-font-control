# Build and test every pull request and every push to main (PRD D17).
name: build
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew build
      # One jar for Fabric and NeoForge (PRD D54).
      - name: Upload mod jar
        uses: actions/upload-artifact@v7
        with:
          name: fontsys-jar
          path: build/libs/
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/
            build/test-results/

  # Boots the real client under Xvfb and runs src/gametest (PRD D17, open question 4).
  # production-jar runs the same tests against the built single jar on a production-style
  # Fabric client (PRD D54); the others run from dev classes.
  client-game-test:
    # Keeps the check names the main branch ruleset requires: client-game-test (vanilla) and (sodium-iris).
    name: client-game-test (${{ matrix.mods }})
    runs-on: ubuntu-24.04
    # A client that can't open its window waits forever; fail fast instead of after 6 hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mods: vanilla
            task: runClientGameTest
            run-dir: clientGameTest
          - mods: sodium-iris
            task: runClientGameTest -PwithSodiumIris
            run-dir: clientGameTest
          - mods: production-jar
            task: runProductionClientGameTest
            run-dir: productionClientGameTest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      # Software OpenGL (llvmpipe) and, as in Fabric API's CI, software Vulkan.
      - name: Install Xvfb and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers
      - name: Run client game tests
        env:
          # 26.3 asks SDL for an sRGB-capable OpenGL framebuffer. Xvfb's GLX offers no sRGB visuals,
          # so OpenGL fails there; EGL handles sRGB per surface instead. Sodium and Iris need OpenGL.
          SDL_VIDEO_FORCE_EGL: '1'
        run: |
          chmod +x ./gradlew
          # Virtual display for the client window.
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew ${{ matrix.task }}
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-game-test-${{ matrix.mods }}
          path: |
            build/run/${{ matrix.run-dir }}/screenshots/
            build/run/${{ matrix.run-dir }}/logs/
            build/run/${{ matrix.run-dir }}/crash-reports/
            build/run/${{ matrix.run-dir }}/config/fontsys/
          if-no-files-found: ignore

  # NeoForge (PRD D51, D54). Fabric's client game tests have no NeoForge counterpart, so a test-only
  # mod boots the NeoForge client under Xvfb with the built single jar in its mods folder, checks
  # the NeoForge wiring, applies a font and quits.
  neoforge-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install Xvfb and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers
      - name: Run NeoForge smoke test
        env:
          # Same display setup as the Fabric game tests above.
          SDL_VIDEO_FORCE_EGL: '1'
        run: |
          chmod +x ./gradlew
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :neoforge:neoforgeSmokeTest
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: neoforge-smoke-test
          path: |
            neoforge/build/run/smokeTest/fontsys-smoketest.txt
            neoforge/build/run/smokeTest/screenshots/
            neoforge/build/run/smokeTest/logs/
            neoforge/build/run/smokeTest/crash-reports/
          if-no-files-found: ignore

  # The NeoForge smoke test with Sodium, and with Sodium and Iris (PRD D57). A separate job, so the
  # neoforge-smoke-test check above keeps its name. sodium: Sodium 0.9.3-beta.5 on Fontsys's
  # NeoForge (26.3.0.103), what players can run today. sodium-iris: the release pair, Sodium 0.9.2
  # and Iris 1.11.7, on NeoForge 26.3.0.64-beta, the last build that pair loads on (see gradle.properties).
  neoforge-compat-test:
    name: neoforge-smoke-test (${{ matrix.mods }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mods: sodium
            flag: -PwithSodium
          - mods: sodium-iris
            flag: -PwithSodiumIris
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install Xvfb and Mesa
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 libegl1 mesa-vulkan-drivers
      - name: Run NeoForge smoke test
        env:
          # Same display setup as the Fabric game tests above; Sodium and Iris need OpenGL.
          SDL_VIDEO_FORCE_EGL: '1'
        run: |
          chmod +x ./gradlew
          xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew :neoforge:neoforgeSmokeTest ${{ matrix.flag }}
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: neoforge-smoke-test-${{ matrix.mods }}
          path: |
            neoforge/build/run/smokeTest/fontsys-smoketest.txt
            neoforge/build/run/smokeTest/screenshots/
            neoforge/build/run/smokeTest/logs/
            neoforge/build/run/smokeTest/crash-reports/
          if-no-files-found: ignore
