# Builds the release jar when a version tag is pushed and attaches it to a draft GitHub
# release (PRD D29). The owner reviews and publishes the draft; publishing it runs the
# publish workflow, which uploads the jar to Modrinth and CurseForge (D31).
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      # The tag must match mod_version, so the jar name and the release agree.
      - name: Check the tag against mod_version
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version=$version in gradle.properties"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew build
      # Release notes: this version's section of CHANGELOG.md.
      - name: Extract release notes
        run: |
          awk -v h="## [$VERSION]" 'index($0, h) == 1 {on=1; next} on && /^## / {exit} on {print}' CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "::error::No CHANGELOG.md section for $VERSION"; exit 1; }
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="build/libs/fontsys-${VERSION}+$(sed -n 's/^minecraft_version=//p' gradle.properties).jar"
          test -f "$jar"
          gh release create "$GITHUB_REF_NAME" "$jar" --draft --verify-tag \
            --title "Fontsys $VERSION" --notes-file release-notes.md
