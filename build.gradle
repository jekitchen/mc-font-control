plugins {
	// Non-remapping Loom: 26.x ships unobfuscated, so there are no mappings.
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Plain JUnit tests that run without the game (PRD D17).
	testImplementation platform("org.junit:junit-bom:${project.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Mods present in the production-style game test run.
	productionRuntimeMods "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Fabric client game tests (PRD D17): src/gametest boots the real client.
// Local: ./gradlew runClientGameTest   CI: ./gradlew runProductionClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "mcfontcontrol-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

tasks.register("runProductionClientGameTest", net.fabricmc.loom.task.prod.ClientProductionRunTask) {
	jvmArgs.add("-Dfabric.client.gametest")
	// Known GitHub Actions issue with the network synchronizer (Fabric docs).
	jvmArgs.add("-Dfabric.client.gametest.disableNetworkSynchronizer=true")
	// CI wraps this task in its own xvfb-run (see .github/workflows/build.yml); don't start a second display.
	useXVFB = false
}

// CI runs the client under its own xvfb-run; stop Loom wrapping dev runs in a second, 8-bit display.
tasks.withType(net.fabricmc.loom.task.AbstractRunTask).configureEach {
	useXvfb = false
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	// LWJGL loads FreeType natives in the discovery tests.
	jvmArgs '--enable-native-access=ALL-UNNAMED'
	testLogging.showStandardStreams = true
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
