// NeoForge side of Fontsys (PRD D51, D54).
//
// Fontsys ships as one jar for both loaders, built by the root project (D54). This project
// supplies the NeoForge parts of it: the io.github.jekitchen.fontsys.neoforge package and
// META-INF/neoforge.mods.toml. For NeoForge dev runs and the bytecode check it also compiles
// the root project's src/main/java (everything except the fabric package) against NeoForge's
// Minecraft; the loader-neutral code is not copied or moved.
// Play:    ./gradlew :neoforge:runNeoforgeClient                (dev classes)
// Check:   ./gradlew :neoforge:neoforgeSmokeTest     (boots the client with the built jar, applies a font, quits)
//          ./gradlew :neoforge:neoforgeSmokeTest -PwithSodium       (the same with Sodium installed, D57)
//          ./gradlew :neoforge:neoforgeSmokeTest -PwithSodiumIris   (with Sodium 0.9.2 and Iris 1.11.7, on an older NeoForge, D57)
plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Compatibility runs only (-PwithSodium, -PwithSodiumIris, PRD D57): Sodium and Iris for
// NeoForge from Modrinth's Maven, as the Fabric game tests get theirs. Never bundled.
repositories {
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content { includeGroup 'maven.modrinth' }
	}
}
def withSodiumIris = project.hasProperty('withSodiumIris')
def withSodium = withSodiumIris || project.hasProperty('withSodium')
// No Sodium and Iris pair loads on NeoForge 26.3.0.65-beta or later yet (see gradle.properties), so
// -PwithSodiumIris builds and runs against the last NeoForge the release pair loads on. A
// -Pneoforge_version on the command line still wins.
def neoforgeVersion = withSodiumIris && !gradle.startParameter.projectProperties.containsKey('neoforge_version')
	? project.neoforge_iris_version : project.neoforge_version

sourceSets {
	main {
		java {
			srcDir rootProject.file('src/main/java')
			// Fabric entry points and Mod Menu; everything else in src/main is loader-neutral.
			exclude 'io/github/jekitchen/fontsys/fabric/**'
		}
		resources {
			// Assets (lang, icon) and the shared mixin config, fontsys.mixins.json.
			srcDir rootProject.file('src/main/resources')
			exclude 'fabric.mod.json'
		}
	}
	// A second, test-only mod that drives the client through a font change and quits (D51).
	smokeTest {
		java {
			// The Fabric game tests' in-world scene (plain server commands), so both loaders
			// render the same signs, text display and name tags (D57).
			srcDir rootProject.file('src/gametest/java')
			include 'io/github/jekitchen/fontsys/neoforge/smoketest/**'
			include 'io/github/jekitchen/fontsys/gametest/InWorldScene.java'
		}
	}
}

neoForge {
	version = neoforgeVersion

	addModdingDependenciesTo sourceSets.smokeTest

	mods {
		fontsys {
			sourceSet sourceSets.main
		}
		fontsys_smoketest {
			sourceSet sourceSets.smokeTest
		}
	}

	runs {
		// Named so that ./gradlew runClient keeps launching only the Fabric client.
		neoforgeClient {
			client()
			loadedMods = [mods.fontsys]
		}
		// Fontsys comes from the built jar in the run's mods folder, not from dev classes, so
		// this tests the file players get (D54).
		neoforgeSmokeTest {
			client()
			sourceSet = sourceSets.smokeTest
			loadedMods = [mods.fontsys_smoketest]
			gameDirectory = project.file('build/run/smokeTest')
			systemProperty 'fontsys.smokeTest', 'true'
			systemProperty 'fontsys.smokeTest.expectJar', 'true'
			// The smoke test checks these mods are loaded, so a missing download can't pass as a run with them.
			systemProperty 'fontsys.smokeTest.expectMods', withSodiumIris ? 'sodium,iris' : withSodium ? 'sodium' : ''
		}
	}
}

dependencies {
	// Compile against Fontsys; at run time it comes from the built jar (see installSmokeTestJar).
	smokeTestCompileOnly sourceSets.main.output
}

// The NeoForge parts of the single jar (D54), picked up by the root project's jar task.
def neoforgePartsTask = tasks.register('neoforgeParts', Sync) {
	from(sourceSets.main.output) {
		include 'io/github/jekitchen/fontsys/neoforge/**'
		include 'META-INF/neoforge.mods.toml'
	}
	into layout.buildDirectory.dir('neoforgeParts')
}
configurations.consumable('neoforgeParts')
artifacts.add('neoforgeParts', layout.buildDirectory.dir('neoforgeParts')) {
	builtBy neoforgePartsTask
}
// This project's compile of the shared code, for the root project's checkSharedBytecode.
configurations.consumable('neoforgeSharedClasses')
artifacts.add('neoforgeSharedClasses', tasks.named('compileJava').flatMap { it.destinationDirectory }) {
	builtBy tasks.named('compileJava')
}

// No separate NeoForge jar any more: the root project builds the one jar (D54).
tasks.named('jar') {
	enabled = false
}

// The built single jar, copied into the smoke test's mods folder.
def modJarScope = configurations.dependencyScope('modJar')
def modJarFiles = configurations.resolvable('modJarFiles') { extendsFrom(modJarScope.get()) }
dependencies {
	modJar project(path: ':', configuration: 'modJarElements')
}
// Sodium (-PwithSodium) or Sodium and Iris (-PwithSodiumIris) for NeoForge (D57); their jars only, no Maven dependencies.
def compatModsScope = configurations.dependencyScope('compatMods')
def compatModsFiles = configurations.resolvable('compatModsFiles') {
	extendsFrom(compatModsScope.get())
	transitive = false
}
dependencies {
	if (withSodium) {
		compatMods "maven.modrinth:sodium:${withSodiumIris ? project.sodium_iris_neoforge_version : project.sodium_neoforge_version}"
	}
	if (withSodiumIris) {
		compatMods "maven.modrinth:iris:${project.iris_neoforge_version}"
	}
}
def smokeRunDir = project.file('build/run/smokeTest')
// Sync, so a run without -PwithSodium removes the jars a run with it left behind.
def installSmokeTestJar = tasks.register('installSmokeTestJar', Sync) {
	from modJarFiles
	from compatModsFiles
	into new File(smokeRunDir, 'mods')
}

// NeoForm Runtime (asset download, Minecraft setup) asks for a Java 21 toolchain by default.
// The build already runs on Java 25, so use that instead of needing a second JDK.
tasks.withType(net.neoforged.nfrtgradle.NeoFormRuntimeTask).configureEach {
	javaExecutable = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }.map { it.executablePath.asFile.absolutePath }
}

// Runs the smoke test client and fails the build unless it passed (D51). CI wraps it in xvfb-run.
tasks.register('neoforgeSmokeTest') {
	group = 'verification'
	description = 'Boots the NeoForge client with Fontsys, applies a font, checks it, and quits.'
	dependsOn 'runNeoforgeSmokeTest'
	def resultFile = new File(smokeRunDir, 'fontsys-smoketest.txt')
	def logFile = new File(smokeRunDir, 'logs/latest.log')
	doFirst {
		if (!resultFile.isFile()) {
			throw new GradleException("The smoke test wrote no result; see ${logFile}")
		}
		def lines = resultFile.readLines('UTF-8')
		lines.each { println it }
		def log = logFile.isFile() ? logFile.readLines('UTF-8') : []
		// Fails on: any Fontsys warning or error (a font that falls back to vanilla logs one; the
		// smoke test expects none); any mixin error; and any mixin warning that names Fontsys or a
		// conflict. With Sodium and Iris their mixins and Fontsys's may touch the same text and glyph
		// code (D57). Other mods' own mixin warnings (Iris's refmap note, its optional targets in
		// mods that aren't installed) are listed below, not failed on.
		def problems = log.findAll {
			def lower = it.toLowerCase()
			def warnOrWorse = it.contains('/WARN]') || it.contains('/ERROR]') || it.contains('/FATAL]')
			(warnOrWorse && it.contains('[Fontsys'))
				|| ((it.contains('/ERROR]') || it.contains('/FATAL]')) && lower.contains('mixin'))
				|| (warnOrWorse && lower.contains('mixin') && (lower.contains('fontsys') || lower.contains('conflict')))
		}
		problems.each { println "LOG: ${it}" }
		// Every other warning and error, for review: printed, not failed on (other mods log their own).
		log.findAll { (it.contains('/WARN]') || it.contains('/ERROR]') || it.contains('/FATAL]')) && !problems.contains(it) }.each { println "OTHER LOG: ${it}" }
		if (lines.last() != 'RESULT PASS' || !problems.isEmpty()) {
			throw new GradleException("NeoForge smoke test failed; see ${resultFile} and ${logFile}")
		}
	}
}

tasks.named('runNeoforgeSmokeTest') {
	dependsOn installSmokeTestJar
	// Start from the vanilla font and a new world, and remove the last result so an old one can't pass for this run.
	def stale = [new File(smokeRunDir, 'fontsys-smoketest.txt'), new File(smokeRunDir, 'config/fontsys.json')]
	def saves = new File(smokeRunDir, 'saves')
	doFirst {
		stale.each { it.delete() }
		saves.deleteDir()
	}
}

processResources {
	def props = [
		version          : project.version,
		neoforge_version : neoforgeVersion,
		minecraft_version: project.minecraft_version,
	]
	inputs.properties props

	filesMatching("META-INF/neoforge.mods.toml") {
		expand props
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

