# NeoForge metadata for Fontsys (PRD D18, D51). Same identity as fabric.mod.json.
license="MIT"
issueTrackerURL="https://github.com/jekitchen/mc-fontsys/issues"

[[mods]]
modId="fontsys"
version="${version}"
displayName="Fontsys"
description='''
Use any font installed on your computer for all in-game text.
'''
authors="jekitchen"
displayURL="https://modrinth.com/mod/fontsys"
iconFile="fontsys:icon.png"

# The mixins both loaders share (src/main/resources/fontsys.mixins.json).
[[mixins]]
config="fontsys.mixins.json"

[[dependencies.fontsys]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.fontsys]]
modId="minecraft"
type="required"
versionRange="[${minecraft_version},26.4)"
ordering="NONE"
side="CLIENT"
